name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Prepare immutable archive or publish an accepted archive
        type: choice
        options: [prepare, publish]
        default: prepare
      prepare_run_id:
        description: Successful prepare run ID (publish only)
        type: string
      sha256:
        description: Exact accepted tarball SHA256 (publish only)
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    if: inputs.stage == 'prepare' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  prepare:
    if: inputs.stage == 'prepare' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release-candidate/
          if-no-files-found: error
          retention-days: 90

  verify:
    if: inputs.stage == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - run: bun run release:verify

  publish:
    if: inputs.stage == 'publish' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      GH_TOKEN: ${{ github.token }}
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release-candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck current advisories and exception expiry
        run: bun run check:audit
      - name: Publish accepted bytes through npm OIDC adapter
        run: bun scripts/release/publish.mjs
