name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Прогон без публикации: посчитать версию и показать changelog'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Trusted Publishing must be configured before the release gate is enabled.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # semantic-release нужна полная история для анализа коммитов
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Verify release artifact policy
        if: ${{ !inputs.dry_run }}
        run: bun scripts/release-preflight.mjs

      - name: Check package
        run: bun run check

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit provenance for the eventual immutable-artifact OIDC release.
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: '${{ github.actor }}@users.noreply.github.com'
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: '${{ github.actor }}@users.noreply.github.com'
        run: ${{ inputs.dry_run && 'bun run release:dry-run' || 'bun run release' }}
