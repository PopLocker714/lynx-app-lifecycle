name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript, contract tests and packaged exports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: app-lifecycle-package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check:audit
      - run: bun dedupe --check
      - run: bun pm licenses

  android:
    name: Kotlin format, Debug/Release compile and Android Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun run check:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-${{ github.sha }}
          path: android/build/reports/lint-results-*

  ios:
    name: Objective-C format, compile and static analysis
    # Xcode 27.2 matches the local compiler; pin it instead of the image default.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Install pinned formatter locally
        run: |
          python3 -m venv .tools/clang-format
          .tools/clang-format/bin/pip install clang-format==21.1.8
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          working-directory: ios-check
      - name: Build locked native SDK fixture
        working-directory: ios-check
        run: |
          BUNDLE_FROZEN=true bundle install
          bundle exec ruby generate-project.rb
          bundle exec pod install --deployment
          xcodebuild -workspace LifecycleCheck.xcworkspace -scheme LifecycleCheck -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 build
      - run: bun run check:ios
        env:
          LYNX_FRAMEWORKS_DIR: ios-check/build/Build/Products/Debug-iphoneos
      - uses: actions/upload-artifact@v4
        with:
          name: ios-analysis-${{ github.sha }}
          path: artifacts/ios/*.plist
          if-no-files-found: error
